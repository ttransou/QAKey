# QAKey — Application Configuration
#
# Copy this file to configure your deployment.
# Environment variable QAKEY_CONFIG can point to an alternate config path.

# ------------------------------------------------------------------
# Application identity
# ------------------------------------------------------------------
app_name: "QAKey"
app_tagline: "Your organization's trusted Q&A knowledge base"

# ------------------------------------------------------------------
# Server
# ------------------------------------------------------------------
host: "127.0.0.1"
port: 5000
debug: false

# ------------------------------------------------------------------
# Knowledge base
# ------------------------------------------------------------------
knowledge:
  records_path: "knowledge/qa_records.yaml"
  synonyms_path: "knowledge/synonyms.yaml"

# ------------------------------------------------------------------
# Matching engine
# ------------------------------------------------------------------
matching:
  # Minimum cosine-similarity score (0–1) required to return an answer.
  # Lower values → more permissive matches (more false positives).
  # Higher values → stricter matches (more fallback responses).
  confidence_threshold: 0.25

  # If the top two matches are within this margin, QAKey should not
  # silently choose between them. It should return an ambiguity fallback.
  ambiguity_margin: 0.08

  # Maximum number of canonical-question suggestions to show when
  # QAKey finds multiple plausible matches.
  max_suggestions: 3

# ------------------------------------------------------------------
# Deterministic fallback behavior
# ------------------------------------------------------------------
fallback:
  # QAKey should never generate, infer, or improvise an answer when
  # confidence is low. Fallback responses are controlled messages.
  enabled: true

  # Message shown when no Active record meets the confidence threshold.
  no_match_message: >
    I could not find an approved answer for that question.
    Please rephrase your question or contact the appropriate team directly.

  # Message shown when more than one Active record is close enough that
  # QAKey should not choose silently.
  ambiguous_match_message: >
    I found more than one possible approved question.
    Please choose the closest match or rephrase your question.

  # Optional contact route shown alongside no-match fallback messaging.
  # The app resolves this into a simple link/button in the user interface.
  human_help:
    enabled: true
    label: "Contact the team"
    type: "email"
    value: "support@example.org"
    display_text: "Email support"

  # Message shown when a related record may exist but is Draft or Inactive.
  unavailable_record_message: >
    This topic may exist in the knowledge base, but it is not currently
    available as an approved answer.

  # Show canonical-question suggestions when fallback behavior can safely
  # offer them without inventing new content.
  show_suggestions: true

  # Log unmatched or low-confidence queries so maintainers can improve
  # canonical questions, alternate phrasings, and synonyms.
  log_unmatched_queries: true
  log_low_confidence_queries: true

  # Optional file path for local fallback review logs.
  # Useful for small/local deployments before a database or analytics layer exists.
  fallback_log_path: "logs/fallback_queries.jsonl"

# ------------------------------------------------------------------
# Editor
# ------------------------------------------------------------------
editor:
  # Set to true to require authentication before accessing /editor.
  # Wire up your own auth middleware when enabling this.
  require_auth: false

  # Simple local admin credentials for the editor login page.
  # Prefer QAKEY_EDITOR_USERNAME and QAKEY_EDITOR_PASSWORD in real deployments.
  admin_username: "admin"
  admin_password: ""
