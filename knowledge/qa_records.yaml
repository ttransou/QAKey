- id: qa-0003
  canonical_question: What is the vacation and paid time off policy?
  answer: 'Full-time employees receive 15 days of paid vacation per calendar year,
    accrued monthly. New hires begin accruing from their first day of employment.
    Unused vacation may be carried over up to a maximum of 5 days. Part-time employees
    accrue leave on a pro-rated basis. Please refer to the Employee Handbook for full
    details or contact hr@example.com.

    '
  status: Active
  alternate_phrasings:
