- id: qa-0008
  canonical_question: What is the remote work and work-from-home policy?
  answer: 'Eligible employees may work remotely up to 3 days per week with manager
    approval. Remote arrangements must be documented in the HR system. Employees are
    expected to be available during core hours (10 AM–3 PM ET) and maintain a professional
    remote work environment. Please review the Remote Work Policy on the intranet
    for full requirements and eligibility criteria.

    '
  status: Draft
