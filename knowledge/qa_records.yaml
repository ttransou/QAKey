- id: qa-0005
  canonical_question: Where can I find the employee handbook?
  answer: 'The Employee Handbook is available on the company intranet at intranet.example.com/handbook.
    A printed copy can also be requested from HR. The handbook is reviewed and updated
    annually; the current version and revision date are shown on the cover page.

    '
  status: Active
