- id: qa-0002
  canonical_question: How do I reset my password?
  answer: 'To reset your password, click "Forgot Password" on the login page and enter
    your registered email address. You will receive a reset link within 5 minutes.
    If you do not receive the email, check your spam folder or contact support@example.com.

    '
  status: Active
