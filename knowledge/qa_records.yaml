- id: qa-0007
  canonical_question: How do I report a technical issue or request IT support?
  answer: 'Submit IT support requests through the helpdesk portal at help.example.com
    or by emailing it@example.com. For urgent issues call the IT hotline at +1-800-555-0199
    (available 8 AM–6 PM ET, weekdays). Include a description of the issue, affected
    device or system, and any error messages. Response time is typically within 2
    business hours for critical issues.

    '
  status: Active
  alternate_phrasings:
