- id: qa-0006
  canonical_question: What health and dental benefits are available?
  answer: 'We offer comprehensive medical, dental, and vision coverage through our
    benefits provider. Employees may enroll during the annual open enrollment period
    or within 30 days of a qualifying life event. Plan summaries, premium schedules,
    and enrollment forms are available on the HR portal. For personalized assistance
    contact benefits@example.com.

    '
  status: Active
