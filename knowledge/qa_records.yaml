- id: qa-0004
  canonical_question: How do I submit an expense report?
  answer: 'Submit expense reports through the Finance portal at finance.example.com/expenses.
    Attach all receipts, select the appropriate cost center, and submit within 30
    days of the expense date. Approval typically takes 5 business days. Reimbursements
    are issued with the next payroll cycle. Contact finance@example.com for assistance.

    '
  status: Active
